<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gier: Revitalized Wiki</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #1f1f1a;
    color: #ddd;
    font-family: Arial, sans-serif;
}

button,
input {
    font: inherit;
}

#top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 55px;
    background: #292925;
    border-bottom: 1px solid #444;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    z-index: 10;
}

#menu {
    background: #3a3a35;
    border: 1px solid #555;
    color: white;
    padding: 8px 12px;
    cursor: pointer;
}

#search {
    width: 250px;
    max-width: 45vw;
    background: #3a3a35;
    border: 1px solid #555;
    color: white;
    padding: 8px;
}

#status {
    color: #999;
    font-size: 13px;
    margin-left: auto;
}

#sidebar {
    position: fixed;
    top: 55px;
    bottom: 0;
    left: -310px;
    width: 310px;
    background: #292925;
    border-right: 1px solid #444;
    overflow-y: auto;
    transition: left .2s;
    z-index: 9;
}

#sidebar.open {
    left: 0;
}

.group {
    border-bottom: 1px solid #444;
}

.groupTitle {
    padding: 10px;
    background: #33332e;
    font-weight: bold;
}

.item {
    padding: 8px 15px;
    color: #ccc;
    cursor: pointer;
}

.item:hover {
    background: #3b3b36;
}

#main {
    max-width: 1100px;
    margin: auto;
    padding: 80px 25px 30px;
}

#title {
    margin: 0 0 5px;
    font-size: 32px;
}

#subtitle {
    color: #999;
    margin-bottom: 25px;
}

.empty {
    color: #888;
    text-align: center;
    margin-top: 100px;
}

.sprite {
    width: 128px;
    height: 128px;
    object-fit: contain;
    image-rendering: pixelated;
    background: #292925;
    border: 1px solid #444;
    padding: 10px;
    margin-bottom: 20px;
}

.section {
    font-size: 23px;
    font-weight: bold;
    border-bottom: 1px solid #555;
    padding-bottom: 6px;
    margin: 30px 0 10px;
}

.stats {
    width: 100%;
    max-width: 750px;
    border: 1px solid #444;
}

.stat {
    display: flex;
    border-bottom: 1px solid #444;
}

.stat:last-child {
    border-bottom: 0;
}

.statName {
    width: 40%;
    padding: 8px;
    color: #aaa;
    background: #292925;
}

.statValue {
    width: 60%;
    padding: 8px;
    color: white;
    background: #32322d;
    word-break: break-word;
}

.raw {
    width: 100%;
    max-width: 900px;
    min-height: 300px;
    padding: 15px;
    background: #292925;
    border: 1px solid #444;
    color: #ccc;
    overflow: auto;
    white-space: pre;
    font-family: monospace;
}

.error {
    color: #d88;
    background: #352525;
    border: 1px solid #633;
    padding: 15px;
}
</style>
</head>

<body>

<div id="top">
    <button id="menu">☰</button>
    <input id="search" type="text" placeholder="Search content...">
    <div id="status">Loading...</div>
</div>

<div id="sidebar"></div>

<main id="main">
    <h1 id="title">Content Wiki</h1>

    <div id="subtitle">
        Loading Gier: Revitalized...
    </div>

    <div id="page">
        <div class="empty">
            Loading content...
        </div>
    </div>
</main>

<script>
const OWNER = "Fat-Bird-Owner";
const REPO = "gier-revitalized";
const BRANCH = "main";

const API =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/git/trees/" +
    BRANCH +
    "?recursive=1";

const RAW =
    "https://raw.githubusercontent.com/" +
    OWNER + "/" +
    REPO +
    "/" +
    BRANCH +
    "/";

const menu = document.getElementById("menu");
const search = document.getElementById("search");
const sidebar = document.getElementById("sidebar");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const page = document.getElementById("page");
const status = document.getElementById("status");

const contents = new Map();

menu.onclick = () => {
    sidebar.classList.toggle("open");
};

search.addEventListener("input", () => {
    const query = search.value.toLowerCase().trim();

    sidebar.querySelectorAll(".item").forEach(item => {
        item.style.display =
            item.textContent.toLowerCase().includes(query)
                ? "block"
                : "none";
    });
});

async function loadWiki() {
    try {
        status.textContent = "Loading...";

        const response = await fetch(API);

        if(!response.ok)
            throw new Error(
                "GitHub API returned " + response.status
            );

        const tree = await response.json();

        if(tree.truncated)
            throw new Error(
                "GitHub returned a truncated file tree."
            );

        const files = tree.tree.filter(
            file => file.type === "blob"
        );

        const contentFiles = files.filter(file => {
            const path = file.path.toLowerCase();

            return (
                path.startsWith("content/") &&
                (
                    path.endsWith(".hjson") ||
                    path.endsWith(".json")
                )
            );
        });

        const spriteFiles = files.filter(file => {
            const path = file.path.toLowerCase();

            return (
                path.startsWith("sprites/") &&
                (
                    path.endsWith(".png") ||
                    path.endsWith(".jpg") ||
                    path.endsWith(".jpeg") ||
                    path.endsWith(".webp")
                )
            );
        });

        const sprites = new Map();

        for(const file of spriteFiles) {
            const name = file.path
                .split("/")
                .pop()
                .replace(/\.[^.]+$/, "");

            sprites.set(name, file.path);
        }

        subtitle.textContent =
            "Loading " +
            contentFiles.length +
            " content files...";

        await Promise.all(
            contentFiles.map(loadContent)
        );

        for(const content of contents.values()) {
            content.sprite =
                findSprite(content.name, sprites);
        }

        buildSidebar();

        status.textContent =
            contents.size + " entries";

        subtitle.textContent =
            "Gier: Revitalized content";

        if(contents.size > 0) {
            const first =
                [...contents.values()]
                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    )[0];

            openPage(first.name);
        } else {
            page.innerHTML =
                "<div class='empty'>" +
                "No content files found." +
                "</div>";
        }

    } catch(error) {
        console.error(error);

        status.textContent = "Error";

        subtitle.textContent =
            "Failed to load repository.";

        page.innerHTML =
            "<div class='error'>" +
            error.message +
            "</div>";
    }
}

async function loadContent(file) {
    const parts = file.path.split("/");
    const contentIndex = parts.indexOf("content");

    if(contentIndex === -1)
        return;

    const relative =
        parts.slice(contentIndex + 1);

    if(relative.length < 2)
        return;

    const type = relative[0];

    const filename =
        relative[relative.length - 1];

    const name =
        filename.replace(
            /\.(hjson|json)$/i,
            ""
        );

    try {
        const response =
            await fetch(
                RAW + file.path
            );

        if(!response.ok)
            return;

        const text =
            await response.text();

        contents.set(name, {
            name,
            type,
            path: file.path,
            text,
            stats: parseHJSON(text),
            sprite: null
        });

    } catch(error) {
        console.error(
            "Failed to load",
            file.path,
            error
        );
    }
}

function findSprite(name, sprites) {
    if(sprites.has(name))
        return sprites.get(name);

    const lower = name.toLowerCase();

    for(const [spriteName, path] of sprites) {
        if(spriteName.toLowerCase() === lower)
            return path;
    }

    return null;
}

function buildSidebar() {
    sidebar.innerHTML = "";

    const groups = {};

    for(const content of contents.values()) {
        if(!groups[content.type])
            groups[content.type] = [];

        groups[content.type].push(content);
    }

    for(const type of Object.keys(groups).sort()) {
        const group =
            document.createElement("div");

        group.className = "group";

        const heading =
            document.createElement("div");

        heading.className = "groupTitle";
        heading.textContent = type;

        group.appendChild(heading);

        groups[type]
            .sort((a, b) =>
                a.name.localeCompare(b.name)
            )
            .forEach(content => {
                const item =
                    document.createElement("div");

                item.className = "item";
                item.textContent = content.name;

                item.onclick = () => {
                    openPage(content.name);
                    sidebar.classList.remove("open");
                };

                group.appendChild(item);
            });

        sidebar.appendChild(group);
    }
}

function openPage(name) {
    const content = contents.get(name);

    if(!content)
        return;

    title.textContent = content.name;

    subtitle.textContent =
        content.type +
        " / " +
        content.path;

    page.innerHTML = "";

    if(content.sprite) {
        const image =
            document.createElement("img");

        image.className = "sprite";
        image.alt = content.name;

        image.src =
            RAW + content.sprite;

        page.appendChild(image);
    }

    addSection("Information");

    const information =
        document.createElement("div");

    information.className = "stats";

    addStat(
        information,
        "Name",
        content.name
    );
    
    addStat(
        information,
        "Type",
        content.type
    );

    addStat(
        information,
        "Description",
        content.description || "..."
    );
    
    addStat(
        information,
        "File",
        content.path
    );

    page.appendChild(information);

    /*
    if(content.stats.length) {
        addSection("Properties");

        const stats =
            document.createElement("div");

        stats.className = "stats";

        for(const stat of content.stats) {
            addStat(
                stats,
                stat.key,
                stat.value,
                stat.depth
            );
        }

        page.appendChild(stats);
    }
    */
    
    addSection("Source");

    const source =
        document.createElement("pre");

    source.className = "raw";
    source.textContent = content.text;

    page.appendChild(source);
}

function addSection(text) {
    const section =
        document.createElement("div");

    section.className = "section";
    section.textContent = text;

    page.appendChild(section);
}

function addStat(
    container,
    key,
    value,
    depth = 0
) {
    const row =
        document.createElement("div");

    row.className = "stat";

    const name =
        document.createElement("div");

    name.className = "statName";
    name.textContent = key;

    const val =
        document.createElement("div");

    val.className = "statValue";
    val.textContent = value;

    if(depth > 0) {
        name.style.paddingLeft =
            (8 + depth * 15) + "px";
    }

    row.appendChild(name);
    row.appendChild(val);

    container.appendChild(row);
}

function parseHJSON(text) {
    const result = [];
    const lines = text.split("\n");
    let depth = 0;

    for(let line of lines) {
        line = line.trim();

        if(!line)
            continue;

        if(line.startsWith("//"))
            continue;

        if(line.startsWith("#"))
            continue;

        let quote = false;
        let comment = -1;

        for(let i = 0; i < line.length - 1; i++) {
            if(
                line[i] === '"' &&
                line[i - 1] !== "\\"
            ) {
                quote = !quote;
            }

            if(
                !quote &&
                line[i] === "/" &&
                line[i + 1] === "/"
            ) {
                comment = i;
                break;
            }
        }

        if(comment !== -1)
            line = line
                .slice(0, comment)
                .trim();

        if(!line)
            continue;

        if(line.endsWith("{")) {
            depth++;
            continue;
        }

        if(line === "}" || line === "},") {
            depth = Math.max(
                0,
                depth - 1
            );
            continue;
        }

        const match =
            line.match(
                /^([A-Za-z0-9_@.-]+)\s*:\s*(.+?)(?:,)?$/
            );

        if(!match)
            continue;

        let value =
            match[2].trim();

        if(
            value.length >= 2 &&
            (
                (
                    value.startsWith('"') &&
                    value.endsWith('"')
                ) ||
                (
                    value.startsWith("'") &&
                    value.endsWith("'")
                )
            )
        ) {
            value =
                value.slice(1, -1);
        }

        result.push({
            key: match[1],
            value,
            depth
        });
    }

    return result;
}

loadWiki();
</script>

</body>
</html>
